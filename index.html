<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA + iPhone full screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CarpoolKaro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#facc15" />
    <meta name="description" content="CarpoolKaro - Hyderabad IT Carpool App" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>CarpoolKaro 🚗</title>

    <style>
      /* Prevent iOS bounce scroll */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        touch-action: manipulation;
      }
      /* Prevent zoom on double tap and pinch */
      * { touch-action: manipulation; }
      /* Prevent long-press context menu on profile photos */
      img {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Safe area for iPhone notch */
      #root {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* Landscape overlay — shown when phone rotates */
      #landscape-block {
        display: none;
        position: fixed;
        inset: 0;
        background: #111;
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      @media screen and (orientation: landscape) {
        #landscape-block { display: flex; }
        #root { display: none; }
      }
    </style>
    <meta property="og:title" content="CarpoolKaro 🚗 — Hyderabad IT Carpool" />
    <meta property="og:description" content="Share rides with IT professionals in Hyderabad. Save money, reduce traffic." />
    <meta property="og:image" content="https://app.carpoolkaro.com/icon-512.png" />
    <meta property="og:url" content="https://app.carpoolkaro.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CarpoolKaro — Hyderabad IT Carpool" />
    <meta name="twitter:description" content="Share rides with IT professionals in Hyderabad." />
  </head>
  <body>
    <!-- Landscape rotation block -->
    <div id="landscape-block">
      <div style="font-size:64px">📱</div>
      <div style="color:#fff;font-size:18px;font-weight:800;font-family:system-ui;">Please rotate your phone</div>
      <div style="color:#666;font-size:14px;font-family:system-ui;text-align:center;padding:0 40px;">CarpoolKaro works in portrait mode only</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
