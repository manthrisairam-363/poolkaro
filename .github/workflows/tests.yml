name: CarpoolKaro Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  # ── Deno DB Tests ──────────────────────────────────────
  deno-tests:
    name: Deno DB Tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run book-ride tests
        run: deno test --allow-net --allow-env --jobs=1 tests/deno/book-ride.test.ts
        continue-on-error: false

      - name: Run cancel-booking tests
        run: deno test --allow-net --allow-env --jobs=1 tests/deno/cancel-booking.test.ts
        continue-on-error: false

      - name: Run wallet tests
        run: deno test --allow-net --allow-env --jobs=1 tests/deno/wallet.test.ts
        continue-on-error: false

  # ── Playwright E2E Tests ───────────────────────────────
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: deno-tests  # only run E2E if DB tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test tests/playwright/ --reporter=list
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
