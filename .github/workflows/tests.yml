name: CarpoolKaro Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deno-tests:
    name: Deno DB Tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run book-ride tests
        run: deno test --allow-net --allow-env tests/deno/book-ride.test.ts
      - name: Run cancel-booking tests
        run: deno test --allow-net --allow-env tests/deno/cancel-booking.test.ts
      - name: Run wallet tests
        run: deno test --allow-net --allow-env tests/deno/wallet.test.ts

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: deno-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install -D @playwright/test
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test tests/playwright/carpoolkaro.spec.ts --project="Mobile Chrome" --reporter=list --timeout=30000
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
